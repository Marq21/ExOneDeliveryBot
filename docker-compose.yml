services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 77.88.8.8      # Yandex DNS для РФ
    extra_hosts:
      # Альтернативные IP Telegram API (попробуйте разные)
      - "api.telegram.org:149.154.167.220"
      - "api.telegram.org:149.154.167.240"
      - "api.telegram.org:91.108.4.10"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"