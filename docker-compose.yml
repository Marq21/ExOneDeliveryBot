services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # === КЛЮЧЕВОЕ: переопределяем DNS для Telegram API ===
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"